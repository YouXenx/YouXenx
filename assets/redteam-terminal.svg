; } }.l9p { animation: show9 18.0s steps(1) infinite; }@keyframes show9 { 0% { opacity: 0; } 54.61% { opacity: 1; } 96% { opacity: 1; } 100% { opacity: 0; } }.l9c { transform-origin: 350.8px 0; animation: type9 18.0s steps(44, end) infinite; }@keyframes type9 { 0%, 54.61% { transform: scaleX(0); } 68.06%, 96% { transform: scaleX(1); } 100% { transform: scaleX(0); } }.l10 { animation: show10 18.0s steps(1) infinite; }@keyframes show10 { 0% { opacity: 0; } 70.83% { opacity: 1; } 96% { opacity: 1; } 100% { opacity: 0; } }
