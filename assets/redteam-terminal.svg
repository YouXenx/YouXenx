ight="22"/></clipPath><text x="24" y="330" class="mono l9p"><tspan fill="#ff2a4d">xensx@redteam</tspan><tspan fill="#9aa4bf">:</tspan><tspan fill="#7aa2f7">~/engagements/acme-lab</tspan><tspan fill="#9aa4bf">$ </tspan></text><g clip-path="url(#c9)"><text x="350.8" y="330" class="mono"><tspan fill="#e6e8f0">./report --format pdf --severity high,medium</tspan></text></g><text x="24" y="358" class="mono l10" fill="#26bf94">[+] 3 findings documented · remediation added · report.pdf saved ✔</text>
